name: Webhook Panchangam

on:
  repository_dispatch:
    types: [panchang-webhook]

permissions:
  contents: read

concurrency:
  group: webhook-panchang
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract date from webhook (defaults to today in IST)
        id: date
        run: |
          DATE="${{ github.event.client_payload.date }}"
          if [[ -z "$DATE" ]]; then
            # Calculate today's IST date explicitly (GitHub Actions runs in UTC)
            IST_DATE=$(date -u -d "+5 hours +30 minutes" +%Y-%m-%d)
            echo "date=$IST_DATE" >> $GITHUB_OUTPUT
            echo "✓ No date provided; using today's IST date: $IST_DATE"
          else
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "✓ Using provided date: $DATE"
          fi

      - name: Validate date format
        run: |
          DATE="${{ steps.date.outputs.date }}"
          if ! date -d "$DATE" +%Y-%m-%d > /dev/null 2>&1; then
            echo "Invalid date format: $DATE. Expected YYYY-MM-DD"
            exit 1
          fi

      - name: Generate Panchangam for specified date
        run: python main.py --now --date "${{ steps.date.outputs.date }}"
